<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battery Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <!-- Removed Leaflet CSS (no embedded map) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- Removed Leaflet JS (no embedded map) -->
  </head>
  <body>
    <script>window.DEFAULT_DEVICE = "{{ current_user.battery_id }}";</script>
    <header class="top">
      <h1>Battery Monitor</h1>
      <div class="controls">
        <label>Window</label>
        <select id="window">
          <option value="2">2h</option>
          <option value="6" selected>6h</option>
          <option value="12">12h</option>
          <option value="24">24h</option>
        </select>
        <button id="refresh" class="btn btn-primary">Refresh</button>
        <div class="user-controls">
          <span class="user-info">Battery: {{ current_user.battery_id }}</span>
          <a href="{{ url_for('change_password') }}" class="btn btn-secondary">Change Password</a>
          <a href="{{ url_for('logout') }}" class="btn btn-secondary">Logout</a>
        </div>
      </div>
    </header>
    <main>
      <div class="bg-shapes" aria-hidden="true">
        <span class="shape circle"></span>
        <span class="shape ring"></span>
        <span class="shape blob"></span>
        <span class="shape arc"></span>
      </div>

      <section class="title-hero">
        <div class="title-main">{{ current_user.battery_id }}</div>
        <div class="title-sub">Battery Monitor</div>
      </section>
      <section class="hero reveal" id="reveal-hero">
        <div class="hero-primary">
          <div class="hero-label">Battery Health</div>
          <div id="k-soc" class="hero-value">–</div>
        </div>
        <div class="hero-secondary">
          <div class="chip"><span class="chip-k">Pack Voltage</span><span id="k-v" class="chip-v">–</span></div>
          <div class="chip"><span class="chip-k">Current</span><span id="k-i" class="chip-v">–</span></div>
          <div class="chip"><span class="chip-k">Temperature</span><span id="k-temp" class="chip-v">–</span></div>
          <div class="chip"><span class="chip-k">Status</span><span id="k-status" class="chip-v">–</span></div>
          <div class="chip"><span class="chip-k">Cycles</span><span id="k-cycles" class="chip-v">–</span></div>
        </div>
      </section>

      <section class="cards">
        <div class="card analytics reveal-scale">
          <h2>Battery Analytics</h2>
          <div class="section">
            <div class="section-title">Trends</div>
            <div class="chart"><canvas id="c-status"></canvas></div>
          </div>
          <div class="divider"></div>
          <div class="section">
            <div class="section-title">Temperatures</div>
            <div class="chart"><canvas id="c-temps"></canvas></div>
          </div>
          <div class="divider"></div>
          <div class="section">
            <div class="section-title">Cell Voltages</div>
            <div class="chart"><canvas id="c-cells"></canvas></div>
          </div>
        </div>
        <div class="card reveal-scale"><h2>Positions</h2>
          <div class="chart"><canvas id="c-pos"></canvas></div>
          <div class="pos-links">
            <div class="pos-links-header">Recent locations</div>
            <div id="pos-links-list" class="pos-links-list"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="/static/main.js"></script>
  </body>
  </html>
